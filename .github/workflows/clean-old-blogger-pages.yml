name: Clean old Blogger pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Get content migration branch
        uses: actions/checkout@v4
        with:
          ref: content-migration

      - name: Update redirects and remove old files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          redirect_path = Path("assets/data/redirect-map.json")
          text = redirect_path.read_text(encoding="utf-8")

          replacements = {
              '"/2025/04/blog-post_23.html": "/posts/שמיני-מָה-פֵּרוּשׁ-הביטוי-מִפַּרְסַת-פַּרְסָה.html"':
              '"/2025/04/blog-post_23.html": "/"',

              '"/2025/06/korach-iyun.html": "/posts/קרח-פדיון-בכור-האדם-והבהמה.html"':
              '"/2025/06/korach-iyun.html": "/posts/קורח-פדיון-בכור-האדם-והבהמה.html"',

              '"/p/blog-page_8.html": "/p/מחוץ-לפרשה.html"':
              '"/p/blog-page_8.html": "/"',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(
                      "ERROR: expected redirect entry not found:\n"
                      + old
                  )

              text = text.replace(old, new)

          redirect_path.write_text(
              text,
              encoding="utf-8",
          )

          old_files = [
              Path(
                  "posts/שמיני-מָה-פֵּרוּשׁ-הביטוי-מִפַּרְסַת-פַּרְסָה.html"
              ),
              Path(
                  "posts/קרח-פדיון-בכור-האדם-והבהמה.html"
              ),
              Path(
                  "p/ילדים.html"
              ),
              Path(
                  "p/מחוץ-לפרשה.html"
              ),
          ]

          for path in old_files:
              if path.exists():
                  path.unlink()
                  print(f"DELETE   {path}")
              else:
                  print(f"ALREADY MISSING   {path}")

          print()
          print("Old Blogger-dependent pages cleaned.")
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          echo "Changes:"
          git status --short

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Remove obsolete Blogger-dependent pages"
            git push origin HEAD:content-migration
          fi
