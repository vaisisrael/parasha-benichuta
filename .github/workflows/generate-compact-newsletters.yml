name: Generate compact newsletters

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-compact-newsletters.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Generate compact PDFs
        shell: bash
        run: |
          cat > generate-newsletters.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const parashot = [
            'יתרו',
            'משפטים',
            'תרומה',
            'תצוה',
            'כי תשא',
            'ויקהל',
            'פקודי',
            'ויקרא',
          ];

          const base = 'https://www.parasha-week.co.il/print.html';
          const outDir = 'compact-newsletters';
          fs.mkdirSync(outDir, { recursive: true });

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            locale: 'he-IL',
            viewport: { width: 1440, height: 1000 },
          });

          for (const parasha of parashot) {
            const page = await context.newPage();
            const url = new URL(base);
            url.searchParams.set('parasha', parasha);
            url.searchParams.set('mode', 'compact');
            url.searchParams.set('v', '24');

            console.log(`Opening ${parasha}: ${url.href}`);
            await page.goto(url.href, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => {
              const html = document.documentElement;
              const compactSheets = document.querySelectorAll('#compact-print-root > .compact-sheet').length;
              return html.classList.contains('print-ready') && compactSheets > 0 && window.__printCompactReady === true;
            }, null, { timeout: 60000 });
            await page.evaluate(async () => {
              if (document.fonts?.ready) await document.fonts.ready;
            });
            await page.emulateMedia({ media: 'print' });

            const safeName = parasha.replace(/[\\/:*?\"<>|]/g, '-');
            const out = path.join(outDir, `${safeName}-חסכוני.pdf`);
            await page.pdf({
              path: out,
              printBackground: true,
              preferCSSPageSize: true,
              landscape: true,
              format: 'A4',
              margin: { top: '0mm', right: '0mm', bottom: '0mm', left: '0mm' },
            });
            console.log(`Created ${out}`);
            await page.close();
          }

          await browser.close();
          JS
          node generate-newsletters.mjs
          ls -lh compact-newsletters

      - name: Upload newsletters artifact
        uses: actions/upload-artifact@v4
        with:
          name: compact-newsletters-tu-bishvat-to-purim
          path: compact-newsletters/*.pdf
          if-no-files-found: error
          retention-days: 30
