name: Check series links

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Inspect series navigation links
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from html import unescape
          from pathlib import Path

          SERIES_LABELS = {
              "📊אידנקסה": "אידנקסה",
              "🔖אידנקסה": "אידנקסה",
              "🤖כבודינה": "כבודינה",
              "🔖כבודינה": "כבודינה",
              "🏢המגדל": "המגדל",
              "🔖המגדל": "המגדל",
          }

          anchor_re = re.compile(
              r'<a\b[^>]*href=["\']([^"\']*)["\'][^>]*>(.*?)</a>',
              flags=re.I | re.S,
          )

          tag_re = re.compile(r"<[^>]+>")

          files = sorted(
              Path("content/posts").rglob("*.json")
          )

          found = 0

          for path in files:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              labels = data.get("labels", [])

              series = next(
                  (
                      SERIES_LABELS[label]
                      for label in labels
                      if label in SERIES_LABELS
                  ),
                  None,
              )

              if not series:
                  continue

              content = data.get(
                  "content_html",
                  "",
              )

              for match in anchor_re.finditer(content):
                  href = unescape(
                      match.group(1)
                  )

                  text = unescape(
                      tag_re.sub(
                          "",
                          match.group(2),
                      )
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      text,
                  ).strip()

                  if (
                      "פרקי" in text
                      or "פרק הראשון" in text
                      or "פרק ראשון" in text
                  ):
                      found += 1

                      print()
                      print("=" * 70)
                      print(f"SERIES: {series}")
                      print(
                          "TITLE: "
                          + str(data.get("title", ""))
                      )
                      print(f"TEXT: {text}")
                      print(f"HREF: {href}")
                      print(
                          "SOURCE: "
                          + path.as_posix()
                      )

          print()
          print("=" * 70)
          print(
              f"NAVIGATION LINKS FOUND: {found}"
          )
          PY
