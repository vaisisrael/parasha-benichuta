name: Check games loader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get content migration branch
        uses: actions/checkout@v4
        with:
          ref: content-migration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check games loader
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          OLD_LOADER = "https://vaisisrael.github.io/games/loader.js"

          files = list(
              Path("content/posts").rglob("*.json")
          ) + list(
              Path("content/pages").rglob("*.json")
          )

          matches = []

          for path in files:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              content = data.get("content_html", "")

              if OLD_LOADER in content:
                  matches.append(
                      (
                          path,
                          data.get("title", ""),
                          content.count(OLD_LOADER),
                      )
                  )

          print(f"Files using old loader: {len(matches)}")

          for path, title, count in matches:
              print(f"{title} | {path} | {count}")

          local_loader = Path("games/loader.js")

          print()
          print(
              "Local games/loader.js exists: "
              f"{local_loader.exists()}"
          )

          if local_loader.exists():
              print(
                  "Local loader size: "
                  f"{local_loader.stat().st_size} bytes"
              )

          unique_fragments = set()

          for path, title, count in matches:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              content = data.get("content_html", "")

              pos = content.find(OLD_LOADER)

              if pos != -1:
                  left = max(0, pos - 120)
                  right = min(
                      len(content),
                      pos + len(OLD_LOADER) + 80,
                  )

                  unique_fragments.add(
                      content[left:right]
                  )

          print()
          print(
              "Unique loader code fragments: "
              f"{len(unique_fragments)}"
          )

          for index, fragment in enumerate(
              sorted(unique_fragments),
              start=1,
          ):
              print()
              print(f"FRAGMENT {index}")
              print(fragment)

          print()
          print("Games loader check completed.")
          PY
