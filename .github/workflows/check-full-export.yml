name: Check full Blogger export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check export contents
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path

          import build_site
          import import_series

          feed_path = Path("series-feed.atom")

          if not feed_path.exists():
              raise SystemExit(
                  "ERROR: series-feed.atom was not found"
              )

          items = build_site.parse_feed(feed_path)

          posts = [
              item
              for item in items
              if item.item_type == "POST"
          ]

          pages = [
              item
              for item in items
              if item.item_type == "PAGE"
          ]

          regular_posts = [
              item
              for item in posts
              if not build_site.is_series_item(item)
          ]

          series_posts = [
              item
              for item in posts
              if build_site.is_series_item(item)
          ]

          paths = [
              item.output_path
              for item in items
          ]

          duplicates = [
              path
              for path, count
              in Counter(paths).items()
              if count > 1
          ]

          print(f"LIVE posts: {len(posts)}")
          print(f"LIVE pages: {len(pages)}")
          print(f"Regular posts: {len(regular_posts)}")
          print(f"Series posts: {len(series_posts)}")
          print(
              "Duplicate output paths: "
              f"{len(duplicates)}"
          )

          if len(posts) != 946:
              raise SystemExit(
                  "ERROR: expected 946 LIVE posts, "
                  f"found {len(posts)}"
              )

          if len(series_posts) != 43:
              raise SystemExit(
                  "ERROR: expected 43 series posts, "
                  f"found {len(series_posts)}"
              )

          if duplicates:
              print("Duplicate paths:")

              for path in duplicates:
                  print(path)

              raise SystemExit(
                  "ERROR: duplicate output paths found"
              )

          Path(
              "expected-regular-post-paths.txt"
          ).write_text(
              "\n".join(
                  item.output_path
                  for item in regular_posts
              ),
              encoding="utf-8",
          )

          series_entries = import_series.parse_feed(
              feed_path
          )

          series_chapters = [
              entry
              for entry in series_entries
              if entry.entry_type == "POST"
          ]

          Path(
              "expected-series-post-paths.txt"
          ).write_text(
              "\n".join(
                  entry.filename
                  for entry in series_chapters
              ),
              encoding="utf-8",
          )

          print(
              "Series importer chapters: "
              f"{len(series_chapters)}"
          )

          if len(series_chapters) != 43:
              raise SystemExit(
                  "ERROR: series importer did not "
                  "identify all 43 chapters"
              )

          print("Export contents check passed.")
          PY

      - name: Build full export
        run: python build_site.py series-feed.atom

      - name: Verify build report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path(
              "build-report.json"
          )

          if not report_path.exists():
              raise SystemExit(
                  "ERROR: build-report.json "
                  "was not created"
              )

          report = json.loads(
              report_path.read_text(
                  encoding="utf-8"
              )
          )

          posts = report.get("posts")

          print(
              f"Build report posts: {posts}"
          )

          if posts != 946:
              raise SystemExit(
                  "ERROR: build report says "
                  f"{posts} posts instead of 946"
              )

          print("Build report check passed.")
          PY

      - name: Verify regular post files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = [
              line.strip()
              for line in Path(
                  "expected-regular-post-paths.txt"
              ).read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip()
          ]

          missing = [
              path
              for path in expected
              if not Path(path).is_file()
          ]

          print(
              "Expected regular post files: "
              f"{len(expected)}"
          )

          print(
              "Missing regular post files: "
              f"{len(missing)}"
          )

          if missing:
              print("First missing files:")

              for path in missing[:30]:
                  print(path)

              raise SystemExit(
                  "ERROR: some regular posts "
                  "have no HTML file"
              )

          print(
              "All regular post files exist."
          )
          PY

      - name: Verify series chapter files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = [
              line.strip()
              for line in Path(
                  "expected-series-post-paths.txt"
              ).read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip()
          ]

          missing = [
              path
              for path in expected
              if not Path(path).is_file()
          ]

          print(
              "Expected series chapter files: "
              f"{len(expected)}"
          )

          print(
              "Missing series chapter files: "
              f"{len(missing)}"
          )

          if missing:
              print("Missing series files:")

              for path in missing:
                  print(path)

              raise SystemExit(
                  "ERROR: some series chapters "
                  "have no imported HTML file"
              )

          print(
              "All 43 series chapter files exist."
          )
          PY

      - name: Verify series index pages
        shell: bash
        run: |
          test -f "p/אידנקסה.html"
          test -f "p/כבודינה.html"
          test -f "p/המגדל.html"

          echo "All three series index pages exist."
