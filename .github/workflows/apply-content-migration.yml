name: Apply content migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Get content migration branch
        uses: actions/checkout@v4
        with:
          ref: content-migration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create independent content files
        run: python migrate_content.py --apply --force

      - name: Commit content files to migration branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content

          if git diff --cached --quiet; then
            echo "No content changes to commit"
          else
            git commit -m "Create independent content files"
            git push origin HEAD:content-migration
          fi
