name: Check generated site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get content migration branch
        uses: actions/checkout@v4
        with:
          ref: content-migration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python build_site.py

      - name: Classify Blogger references
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          BLOGGER_MARKERS = (
              "blogger.googleusercontent.com",
              "blogspot.com",
              "theweekparasha.blogspot.com",
          )

          SERIES_LABELS = {
              "📊אידנקסה",
              "🤖כבודינה",
              "🏢המגדל",
              "🔖אידנקסה",
              "🔖כבודינה",
              "🔖המגדל",
          }

          content_files = sorted(
              list(Path("content/posts").rglob("*.json"))
              + list(Path("content/pages").rglob("*.json"))
          )

          outputs = {}
          series_outputs = set()

          for path in content_files:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              output = str(
                  data.get("output_path", "")
              ).strip()

              if not output:
                  continue

              outputs[output] = (
                  data.get("title", ""),
                  path.as_posix(),
              )

              labels = set(
                  data.get("labels", [])
              )

              if labels & SERIES_LABELS:
                  series_outputs.add(output)

              if (
                  data.get("item_type") == "PAGE"
                  and data.get("title") in {
                      "אידנקסה",
                      "כבודינה",
                      "המגדל",
                  }
              ):
                  series_outputs.add(output)

          hits = []

          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue

              relative = path.as_posix()

              if relative.startswith("backups/"):
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore",
              ).lower()

              markers = [
                  marker
                  for marker in BLOGGER_MARKERS
                  if marker in text
              ]

              if not markers:
                  continue

              if relative in series_outputs:
                  category = "SERIES OUTPUT"

              elif relative in outputs:
                  category = "CONTENT OUTPUT"

              else:
                  category = "ORPHAN / PRESERVED FILE"

              hits.append(
                  (
                      category,
                      relative,
                      markers,
                      outputs.get(relative),
                  )
              )

          print(
              f"Live HTML Blogger hits: {len(hits)}"
          )

          categories = {
              "CONTENT OUTPUT": [],
              "SERIES OUTPUT": [],
              "ORPHAN / PRESERVED FILE": [],
          }

          for hit in hits:
              categories[hit[0]].append(hit)

          for category, items in categories.items():
              print()
              print("=" * 70)
              print(category)
              print("=" * 70)
              print(f"FILES FOUND: {len(items)}")

              for _, relative, markers, info in items:
                  print()
                  print(f"FILE: {relative}")

                  if info:
                      print(f"TITLE: {info[0]}")
                      print(f"SOURCE JSON: {info[1]}")

                  print(
                      "MARKERS: "
                      + ", ".join(markers)
                  )

          print()
          print("Classification completed.")
          PY
