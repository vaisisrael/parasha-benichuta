name: Check generated site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get content migration branch
        uses: actions/checkout@v4
        with:
          ref: content-migration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python build_site.py

      - name: Check generated HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path(".")

          html_files = sorted(
              path
              for path in ROOT.rglob("*.html")
              if ".git" not in path.parts
          )

          print(f"HTML files scanned: {len(html_files)}")

          blogger_patterns = [
              "blogger.googleusercontent.com",
              "blogspot.com",
              "theweekparasha.blogspot.com",
          ]

          blogger_hits = []

          for path in html_files:
              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore",
              )

              for pattern in blogger_patterns:
                  if pattern.lower() in text.lower():
                      blogger_hits.append(
                          (path.as_posix(), pattern)
                      )

          print()
          print(
              "Generated HTML files containing "
              f"Blogger references: {len(blogger_hits)}"
          )

          for path, pattern in blogger_hits[:50]:
              print(f"{path} | {pattern}")

          required_files = [
              Path("index.html"),
              Path("posts/ויחי-חידות-פתרונות.html"),
              Path("posts/ואתחנן-עשרת-הדברות-וקריאת-שמע.html"),
              Path("posts/ראה-משחקים-חכמים.html"),
          ]

          print()
          print("Representative pages:")

          missing = []

          for path in required_files:
              exists = path.exists()

              print(
                  f"{path.as_posix()}: "
                  f"{'OK' if exists else 'MISSING'}"
              )

              if not exists:
                  missing.append(
                      path.as_posix()
                  )

          local_image_refs = set()
          missing_local_images = []

          image_re = re.compile(
              r'''(?:src|href)=["'](/assets/images/[^"']+)["']''',
              flags=re.I,
          )

          for path in html_files:
              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore",
              )

              for match in image_re.finditer(text):
                  url = match.group(1)

                  local_image_refs.add(url)

                  local_path = Path(
                      url.lstrip("/")
                  )

                  if not local_path.exists():
                      missing_local_images.append(
                          (
                              path.as_posix(),
                              url,
                          )
                      )

          missing_local_images = sorted(
              set(missing_local_images)
          )

          print()
          print(
              "Unique local image references: "
              f"{len(local_image_refs)}"
          )

          print(
              "Missing local image references: "
              f"{len(missing_local_images)}"
          )

          for path, url in missing_local_images[:50]:
              print(
                  f"{path} -> {url}"
              )

          if blogger_hits:
              raise SystemExit(
                  "ERROR: Blogger references remain "
                  "in generated HTML"
              )

          if missing:
              raise SystemExit(
                  "ERROR: representative pages missing"
              )

          if missing_local_images:
              raise SystemExit(
                  "ERROR: local image files are missing"
              )

          print()
          print("GENERATED SITE CHECK OK")
          PY
