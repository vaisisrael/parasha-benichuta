name: בדיקת העברת עלון נח מדרייב
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-noach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download Noach PDF from shared Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          mkdir -p alonim
          gdown --id 1iT0YcYDvK3gXitr8YCMZogg_clUImXvn --output 'alonim/נח-חסכוני.pdf'
          test "$(stat -c%s 'alonim/נח-חסכוני.pdf')" -gt 1000000
          file 'alonim/נח-חסכוני.pdf'
          head -c 5 'alonim/נח-חסכוני.pdf' | grep -q '%PDF-'
      - name: Commit Noach PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'alonim/נח-חסכוני.pdf'
          if ! git diff --cached --quiet; then
            git commit -m 'Import Noach newsletter PDF from Drive'
            git push
          fi
