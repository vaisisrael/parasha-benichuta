name: בדיקת האתר הדינמי

on:
  push:
    branches:
      - dynamic-parasha-home
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: node --check assets/js/site.js

      - name: Build site
        run: python build_site.py

      - name: Build series
        run: python import_series.py --apply

      - name: Verify site config exists
        run: test -f site_config.json

      - name: Verify generated home page exists
        run: test -f index.html

      - name: Verify parasha archives exist
        run: test -d parashot

      - name: Prepare preview folder
        shell: bash
        run: |
          rm -rf _preview
          mkdir -p _preview

          for item in \
            index.html \
            404.html \
            CNAME \
            site_config.json \
            assets \
            about \
            games \
            shorts \
            p \
            parashot \
            posts
          do
            if [ -e "$item" ]; then
              cp -a "$item" _preview/
            fi
          done

          touch _preview/.nojekyll

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-site-preview
          path: _preview
          if-no-files-found: error
