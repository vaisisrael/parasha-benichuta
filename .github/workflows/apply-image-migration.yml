name: Apply image migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Get content migration branch
        uses: actions/checkout@v4
        with:
          ref: content-migration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and rewrite images
        run: python migrate_images.py --apply

      - name: Commit migrated images and content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/images/content \
            content

          if git diff --cached --quiet; then
            echo "No image migration changes to commit"
          else
            git commit -m "Migrate Blogger images to local assets"
            git push origin HEAD:content-migration
          fi
