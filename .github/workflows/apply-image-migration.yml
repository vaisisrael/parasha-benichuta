name: Apply image migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Get content migration branch
        uses: actions/checkout@v4
        with:
          ref: content-migration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and rewrite images
        id: migrate_images
        continue-on-error: true
        run: python migrate_images.py --apply

      - name: Save downloaded images and report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/images/content \
            content/image-migration-report.json

          if git diff --cached --quiet; then
            echo "No downloaded images or report to commit"
          else
            git commit -m "Save image migration progress"
            git push origin HEAD:content-migration
          fi

      - name: Commit rewritten content
        if: steps.migrate_images.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content

          if git diff --cached --quiet; then
            echo "No rewritten content changes to commit"
          else
            git commit -m "Rewrite content to local image paths"
            git push origin HEAD:content-migration
          fi

      - name: Fail workflow if migration failed
        if: steps.migrate_images.outcome != 'success'
        shell: bash
        run: |
          echo "Image migration did not complete successfully."
          echo "Downloaded images and the failure report were saved."
          exit 1
