name: Build and deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python build_site.py blogger-export-links.atom

      - name: Prepare publish folder
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          for item in \
            index.html \
            404.html \
            CNAME \
            assets \
            about \
            family \
            games \
            p \
            parashot \
            posts \
            search \
            sections \
            series
          do
            if [ -e "$item" ]; then
              cp -a "$item" _site/
            fi
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
