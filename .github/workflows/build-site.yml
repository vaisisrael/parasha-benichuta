name: פרסום האתר

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python build_site.py

      - name: Build series
        run: python import_series.py --apply

      - name: Update print cards
        run: python postprocess_print_cards.py

      - name: Prepare publish folder
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          for item in \
            index.html \
            print.html \
            404.html \
            CNAME \
            site_config.json \
            assets \
            about \
            games \
            shorts \
            p \
            parashot \
            posts
          do
            if [ -e "$item" ]; then
              cp -a "$item" _site/
            fi
          done

          touch _site/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          cname: www.parasha-week.co.il
