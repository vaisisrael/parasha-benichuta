name: Check external media

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get content migration branch
        uses: actions/checkout@v4
        with:
          ref: content-migration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan external media
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlparse

          URL_RE = re.compile(
              r'https?://[^"\'<>\s)]+',
              flags=re.I,
          )

          content_files = list(
              Path("content/posts").rglob("*.json")
          ) + list(
              Path("content/pages").rglob("*.json")
          )

          hosts = Counter()
          urls_by_host = {}

          for path in content_files:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              content = data.get(
                  "content_html",
                  "",
              )

              for url in URL_RE.findall(content):
                  host = (
                      urlparse(url).hostname
                      or ""
                  ).lower()

                  if not host:
                      continue

                  hosts[host] += 1

                  urls_by_host.setdefault(
                      host,
                      set(),
                  ).add(url)

          print(
              f"Content files scanned: "
              f"{len(content_files)}"
          )

          print("\nExternal hosts:")

          for host, count in hosts.most_common():
              print(
                  f"{host}: "
                  f"{count} references, "
                  f"{len(urls_by_host[host])} unique URLs"
              )

          print("\nSample URLs by host:")

          for host in sorted(urls_by_host):
              print(f"\n[{host}]")

              for url in sorted(
                  urls_by_host[host]
              )[:10]:
                  print(url)

          print(
              "\nExternal media scan completed."
          )
          PY
