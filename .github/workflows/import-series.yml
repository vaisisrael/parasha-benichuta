}

BOOK_ORDER = [
    "בראשית",
    "שמות",
    "ויקרא",
    "במדבר",
    "דברים",
]

TAG_RE = re.compile(
    r"<[^>]+>"
)


@dataclass
class Entry:
    entry_type: str
    title: str
    content: str
    description: str
    filename: str
    number: int | None
    series_name: str


def normalize(
    value: str,
) -> str:
    return re.sub(
        r"\s+",
        " ",
        value or "",
    ).strip()


def strip_tags(
    value: str,
) -> str:
    return normalize(
        html.unescape(
            TAG_RE.sub(
                " ",
                value or "",
            )
        )
    )


def chapter_number(
    title: str,
) -> int | None:
    match = re.match(
        r"^\s*(\d{1,3})\s*[-–—:]",
        title or "",
    )

    return (
        int(match.group(1))
        if match
        else None
    )


def detect_series(
    data: dict,
) -> str | None:
    explicit = data.get(
        "series"
    )

    if explicit in SERIES:
        return explicit

    title = str(
        data.get(
            "title",
            "",
        )
    ).strip()

    item_type = str(
        data.get(
            "item_type",
            "",
        )
    ).strip().upper()

    if (
        item_type == "PAGE"
        and title in SERIES
    ):
        return title

    labels = {
        str(label).strip()
        for label in data.get(
            "labels",
            [],
        )
        if str(label).strip()
    }

    for (
        series_name,
        definition,
    ) in SERIES.items():
        if (
            labels
            & definition["labels"]
        ):
            return series_name

    return None


def load_entries(
    content_root: Path,
) -> list[Entry]:
    files = sorted(
        list(
            (
                content_root
                / "posts"
            ).rglob("*.json")
        )
        + list(
            (
                content_root
                / "pages"
            ).rglob("*.json")
        )
    )

    if not files:
        raise FileNotFoundError(
            "No content JSON files found "
            f"under {content_root}"
        )

    entries: list[Entry] = []

    for path in files:
        data = json.loads(
            path.read_text(
                encoding="utf-8"
            )
        )

        series_name = detect_series(
            data
        )

        if not series_name:
            continue

        entry_type = str(
            data.get(
                "item_type",
                "",
            )
        ).strip().upper()

        if entry_type not in {
            "POST",
            "PAGE",
        }:
            continue

        title = str(
            data.get(
                "title",
                "ללא כותרת",
            )
        ).strip()

        content = str(
            data.get(
                "content_html",
                "",
            )
        )

        description = str(
            data.get(
                "description",
                "",
            )
        ).strip()

        filename = str(
            data.get(
                "output_path",
                "",
            )
        ).strip().lstrip("/")

        number = (
            chapter_number(
                title
            )
            if entry_type == "POST"
            else None
        )

        if (
            entry_type == "POST"
            and number is None
        ):
            print(
                "WARNING: skipped chapter "
                f'without number: "{title}"'
            )
            continue

        if not filename:
            filename = (
                f"p/{series_name}.html"
                if entry_type == "PAGE"
                else (
                    f"series/"
                    f"{series_name}/"
                    f"{number:02d}.html"
                )
            )

        entries.append(
            Entry(
                entry_type=entry_type,
                title=title,
                content=content,
                description=description,
                filename=filename,
                number=number,
                series_name=series_name,
            )
        )

    return entries


def first_image(
    content: str,
) -> str | None:
    match = re.search(
        (
            r'<img\b[^>]*'
            r'\bsrc=["\']'
            r'([^"\']+)'
            r'["\']'
        ),
        content,
        flags=re.I,
    )

    return (
        match.group(1)
        if match
        else None
    )


def prefix_for(
    output_path: str,
) -> str:
    return "../" * (
        len(
            Path(
                output_path
            ).parts
        )
        - 1
    )


def discover_parashot(
    root: Path,
    prefix: str,
) -> str:
    books_html: list[str] = []

    for book in BOOK_ORDER:
        book_dir = (
            root
            / "parashot"
            / book
        )

        links: list[str] = []

        if book_dir.exists():
            directories = sorted(
                path
                for path
                in book_dir.iterdir()
                if path.is_dir()
            )

            for parasha_dir in directories:
                index_path = (
                    parasha_dir
                    / "index.html"
                )

                name = parasha_dir.name

                if index_path.exists():
                    source = (
                        index_path.read_text(
                            encoding="utf-8",
                            errors="ignore",
                        )
                    )

                    match = re.search(
                        (
                            r"<h1[^>]*>"
                            r"\s*פרשת\s+"
                            r"([^<]+)"
                            r"</h1>"
                        ),
                        source,
                        flags=re.I,
                    )

                    if match:
                        name = (
                            html.unescape(
                                match.group(1)
                            )
                            .strip()
                        )

                links.append(
                    (
                        f'<li><a href="'
                        f'{prefix}parashot/'
                        f'{book}/'
                        f'{parasha_dir.name}/">'
                        f'{html.escape(name)}'
                        f'</a></li>'
                    )
                )

        books_html.append(
            (
                '<li class="has-sub">'
                f'<button type="button">'
                f'{book}'
                f'</button>'
                f'<ul>{"".join(links)}</ul>'
                f'</li>'
            )
        )

    return "".join(
        books_html
    )


