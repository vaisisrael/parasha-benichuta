def chapter_page(
    root: Path,
    entry: Entry,
) -> str:
    prefix = prefix_for(
        entry.filename
    )

    description = (
        entry.description
        or strip_tags(
            entry.content
        )[:180]
    )

    body = f"""
<article class="post-page series-chapter-page">

  <header class="post-header">

    <div class="post-meta">
      <a href="{prefix}p/{entry.series_name}.html">
        {html.escape(entry.series_name)}
      </a>
      · פרק {entry.number:02d}
    </div>

    <h1>
      {html.escape(entry.title)}
    </h1>

  </header>

  <div class="post-content">
    {entry.content}
  </div>

</article>
"""

    return layout(
        root,
        entry.title,
        description,
        entry.filename,
        body,
    )


def series_page(
    root: Path,
    series_name: str,
    page_entry: Entry | None,
    chapters: list[Entry],
) -> tuple[str, str]:
    output_path = (
        f"p/{series_name}.html"
    )

    series_class = (
        SERIES_CLASSES[
            series_name
        ]
    )

    description = (
        page_entry.description
        if (
            page_entry
            and page_entry.description
        )
        else SERIES[
            series_name
        ]["description"]
    )

    cover = None

    if page_entry:
        cover = first_image(
            page_entry.content
        )

    if (
        not cover
        and chapters
    ):
        cover = first_image(
            chapters[0].content
        )

    cover_html = (
        (
            '<img '
            'class="series-cover-image" '
            f'src="{html.escape(cover, quote=True)}" '
            f'alt="{html.escape(series_name)}">'
        )
        if cover
        else ""
    )

    cards: list[str] = []

    for chapter in sorted(
        chapters,
        key=lambda item: (
            item.number or 0
        ),
    ):
        image = first_image(
            chapter.content
        )

        image_html = (
            (
                f'<img '
                f'src="{html.escape(image, quote=True)}" '
                f'alt="" '
                f'loading="lazy">'
            )
            if image
            else (
                '<div '
                'class="card-placeholder">'
                '📖'
                '</div>'
            )
        )

        chapter_url = (
            f"../{chapter.filename}"
        )

        chapter_description = (
            chapter.description
            or strip_tags(
                chapter.content
            )[:190]
        )

        cards.append(
            f"""
<article class="card series-chapter-card">

  <a
    class="card-media"
    href="{html.escape(chapter_url, quote=True)}"
  >
    {image_html}
  </a>

  <div class="card-body">

    <div class="eyebrow">
      פרק {chapter.number:02d}
    </div>

    <h2>
      <a href="{html.escape(chapter_url, quote=True)}">
        {html.escape(chapter.title)}
      </a>
    </h2>

    <p>
      {html.escape(chapter_description)}
    </p>

    <a
      class="read-link"
      href="{html.escape(chapter_url, quote=True)}"
    >
      לקריאת הפרק
    </a>

  </div>

</article>
"""
        )

    body = f"""
<section class="series-hero">

  <div class="series-hero-media">
    {cover_html}
  </div>

  <div class="series-hero-copy">

    <div class="eyebrow">
      סדרת רשת
    </div>

    <h1>
      {html.escape(series_name)}
    </h1>

    <p>
      {html.escape(description)}
    </p>

    <div class="series-count">
      {len(chapters)} פרקים
    </div>

  </div>

</section>

<section class="series-chapters series-{series_class}">

  <h2 class="series-chapters-title">
    פרקי הסדרה
  </h2>

  <div class="cards-grid series-grid">
    {"".join(cards)}
  </div>

</section>
"""

    return (
        output_path,
        layout(
            root,
            series_name,
            description,
            output_path,
            body,
        ),
    )


def backup(
    root: Path,
    relative: str,
    backup_root: Path,
) -> None:
    source = (
        root
        / relative
    )

    if source.exists():
        destination = (
            backup_root
            / relative
        )

        destination.parent.mkdir(
            parents=True,
            exist_ok=True,
        )

        shutil.copy2(
            source,
            destination,
        )


def write(
    root: Path,
    relative: str,
    content: str,
) -> None:
    destination = (
        root
        / relative
    )

    destination.parent.mkdir(
        parents=True,
        exist_ok=True,
    )

    destination.write_text(
        content,
        encoding="utf-8",
    )


def validate(
    entries: list[Entry],
) -> None:
    for (
        series_name,
        definition,
    ) in SERIES.items():
        chapters = [
            entry
            for entry in entries
            if (
                entry.series_name
                == series_name
                and entry.entry_type
                == "POST"
            )
        ]

        expected = definition[
            "expected"
        ]

        numbers = sorted(
            entry.number
            for entry in chapters
            if (
                entry.number
                is not None
            )
        )

        if (
            len(chapters)
            != expected
        ):
            raise RuntimeError(
                f"{series_name}: "
                f"expected {expected}, "
                f"found {len(chapters)}"
            )

        if numbers != list(
            range(
                1,
                expected + 1,
            )
        ):
            raise RuntimeError(
                f"{series_name}: "
                "incomplete chapter "
                f"sequence: {numbers}"
            )

        pages = [
            entry
            for entry in entries
            if (
                entry.series_name
                == series_name
                and entry.entry_type
                == "PAGE"
            )
        ]

        if len(pages) > 1:
            raise RuntimeError(
                f"{series_name}: "
                f"found {len(pages)} "
                "series pages"
            )


def validate_local_images(
    root: Path,
    entries: list[Entry],
) -> None:
    missing: list[
        tuple[str, str]
    ] = []

    local_re = re.compile(
        r'''(?:src|href)=["'](/assets/images/[^"']+)["']''',
        flags=re.I,
    )

    for entry in entries:
        for match in local_re.finditer(
            entry.content
        ):
            url = match.group(1)

            path = (
                root
                / url.lstrip("/")
            )

            if not path.exists():
                missing.append(
                    (
                        entry.title,
                        url,
                    )
                )

    missing = sorted(
        set(missing)
    )

    if missing:
        print()
        print(
            "Missing local images:"
        )

        for title, url in missing:
            print(
                f"{title} -> {url}"
            )

        raise RuntimeError(
            f"{len(missing)} local image "
            "references are missing"
        )


def validate_no_blogger(
    entries: list[Entry],
) -> None:
    markers = (
        "blogger.googleusercontent.com",
        "blogspot.com",
        "theweekparasha.blogspot.com",
    )

    hits: list[
        tuple[str, str]
    ] = []

    for entry in entries:
        lowered = (
            entry.content.lower()
        )

        for marker in markers:
            if marker in lowered:
                hits.append(
                    (
                        entry.title,
                        marker,
                    )
                )

    if hits:
        print()
        print(
            "Blogger references found "
            "in series source content:"
        )

        for title, marker in hits:
            print(
                f"{title} -> {marker}"
            )

        raise RuntimeError(
            "Series content still contains "
            "Blogger references"
        )


