name: Import series

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import series and images
        run: python import_series.py --apply

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                   git add \
            assets/images/series \
            assets/css/site.css \
            p \
            posts \
            2020 \
            backups

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import series pages and images"
            git push
          fi
