def main() -> int:
    parser = (
        argparse.ArgumentParser()
    )

    parser.add_argument(
        "--apply",
        action="store_true",
    )

    args = parser.parse_args()

    root = (
        Path(__file__)
        .resolve()
        .parent
    )

    content_root = (
        root
        / "content"
    )

    try:
        entries = load_entries(
            content_root
        )

        validate(
            entries
        )

        validate_no_blogger(
            entries
        )

        validate_local_images(
            root,
            entries,
        )

    except (
        FileNotFoundError,
        RuntimeError,
        ValueError,
        json.JSONDecodeError,
    ) as error:
        print(
            f"ERROR: {error}"
        )

        return 1

    print(
        "Series check:"
    )

    total_chapters = 0

    for name in SERIES:
        count = len(
            [
                entry
                for entry in entries
                if (
                    entry.series_name
                    == name
                    and entry.entry_type
                    == "POST"
                )
            ]
        )

        total_chapters += count

        print(
            f"  {name}: "
            f"{count} chapters"
        )

    print(
        f"  total chapters: "
        f"{total_chapters}"
    )

    print(
        "  source: "
        "content/posts + content/pages"
    )

    if not args.apply:
        print()
        print(
            "DRY RUN OK — "
            "series content is independent "
            "of Blogger and no files changed."
        )

        return 0

    backup_root = (
        root
        / "backups"
        / (
            "series-"
            + datetime.now()
            .strftime(
                "%Y%m%d-%H%M%S"
            )
        )
    )

    for series_name in SERIES:
        page_entry = next(
            (
                entry
                for entry in entries
                if (
                    entry.series_name
                    == series_name
                    and entry.entry_type
                    == "PAGE"
                )
            ),
            None,
        )

        chapters = [
            entry
            for entry in entries
            if (
                entry.series_name
                == series_name
                and entry.entry_type
                == "POST"
            )
        ]

        (
            index_path,
            index_html,
        ) = series_page(
            root,
            series_name,
            page_entry,
            chapters,
        )

        backup(
            root,
            index_path,
            backup_root,
        )

        write(
            root,
            index_path,
            index_html,
        )

        print(
            f"WRITE    "
            f"{index_path}"
        )

        for chapter in sorted(
            chapters,
            key=lambda item: (
                item.number or 0
            ),
        ):
            backup(
                root,
                chapter.filename,
                backup_root,
            )

            write(
                root,
                chapter.filename,
                chapter_page(
                    root,
                    chapter,
                ),
            )

            print(
                "WRITE    "
                f"{chapter.filename}"
            )

    append_css(
        root
    )

    print()
    print(
        "Backup: "
        f"{backup_root.relative_to(root)}"
    )

    print(
        "Series build completed "
        "successfully from content JSON."
    )

    return 0


if __name__ == "__main__":
    raise SystemExit(
        main()
    )
