name: Check first chapter buttons

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Inspect links to first chapters
        shell: bash
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from pathlib import Path

          SERIES_LABELS = {
              "📊אידנקסה": "אידנקסה",
              "🔖אידנקסה": "אידנקסה",
              "🤖כבודינה": "כבודינה",
              "🔖כבודינה": "כבודינה",
          }

          anchor_re = re.compile(
              r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',
              flags=re.I | re.S,
          )

          tag_re = re.compile(r"<[^>]+>")

          for path in sorted(
              Path("content/posts").rglob("*.json")
          ):
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              labels = data.get("labels", [])

              series = (
                  data.get("series")
                  if data.get("series") in {
                      "אידנקסה",
                      "כבודינה",
                  }
                  else next(
                      (
                          SERIES_LABELS[label]
                          for label in labels
                          if label in SERIES_LABELS
                      ),
                      None,
                  )
              )

              if not series:
                  continue

              content = str(
                  data.get("content_html", "")
              )

              for match in anchor_re.finditer(content):
                  href = html.unescape(
                      match.group(1)
                  )

                  text = html.unescape(
                      tag_re.sub(
                          " ",
                          match.group(2),
                      )
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      text,
                  ).strip()

                  interesting = (
                      "ראשון" in text
                      or "פרק 1" in text
                      or "פרק 01" in text
                      or "/01-" in href
                      or "01-" in href
                  )

                  if interesting:
                      print()
                      print("=" * 70)
                      print(f"SERIES: {series}")
                      print(
                          "TITLE: "
                          + str(data.get("title", ""))
                      )
                      print(f"TEXT: {text}")
                      print(f"HREF: {href}")
                      print(
                          "SOURCE: "
                          + path.as_posix()
                      )

          print()
          print("FIRST-CHAPTER LINK CHECK COMPLETE")
          PY
