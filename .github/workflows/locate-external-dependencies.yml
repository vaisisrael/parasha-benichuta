name: Locate external dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest

    steps:
      - name: Get content migration branch
        uses: actions/checkout@v4
        with:
          ref: content-migration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate dependencies
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          TARGETS = [
              "blogger.googleusercontent.com",
              "theweekparasha.blogspot.com",
              "vaisisrael.github.io",
              "upload.wikimedia.org",
              "raw.githubusercontent.com",
          ]

          files = (
              list(Path("content/posts").rglob("*.json"))
              + list(Path("content/pages").rglob("*.json"))
          )

          for target in TARGETS:
              print()
              print("=" * 70)
              print(target)
              print("=" * 70)

              found = 0

              for path in files:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )

                  content = data.get("content_html", "")

                  if target not in content:
                      continue

                  found += 1

                  print()
                  print(f"FILE: {path}")
                  print(f"TITLE: {data.get('title', '')}")
                  print(f"OUTPUT: {data.get('output_path', '')}")

                  start = 0

                  while True:
                      pos = content.find(target, start)

                      if pos == -1:
                          break

                      left = max(0, pos - 180)
                      right = min(
                          len(content),
                          pos + len(target) + 300,
                      )

                      snippet = content[left:right]
                      snippet = snippet.replace("\n", " ")

                      print("SNIPPET:")
                      print(snippet)
                      print("---")

                      start = pos + len(target)

              print()
              print(f"FILES FOUND: {found}")

          print()
          print("Dependency location scan completed.")
          PY
