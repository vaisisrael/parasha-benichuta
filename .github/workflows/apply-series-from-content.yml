name: Apply series from content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Get main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build series from content
        run: python import_series.py --apply

      - name: Commit generated series
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            p/אידנקסה.html \
            p/כבודינה.html \
            p/המגדל.html \
            posts/*.html \
            assets/css/site.css

          echo "Changes to commit:"
          git status --short

          if git diff --cached --quiet; then
            echo "No generated series changes to commit."
          else
            git commit -m "Build series from independent content"
            git push origin HEAD:main
          fi
