<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מעבירים אתכם לעמוד המבוקש</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f3ea;
      color: #263238;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(620px, calc(100% - 32px));
      padding: 36px;
      background: #fff;
      border: 1px solid rgba(38, 50, 56, .12);
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(38, 50, 56, .08);
    }

    h1 {
      margin-top: 0;
    }

    a {
      color: #4f7f87;
      font-weight: 700;
    }
  </style>

  <meta name="theme-color" content="#4f6d5a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/images/branding/favicon.png">
  <link rel="stylesheet" href="/assets/css/pwa-install.css">


  <link rel="stylesheet" href="/assets/css/accessibility.css">

</head>

<body>

<a class="skip-link" href="#main-content">דלגו לתוכן הראשי</a>

  <main id="main-content" tabindex="-1">
    <h1 id="title">מחפשים את העמוד…</h1>

    <p id="message">
      אם הכתובת שונתה, נעביר אתכם אוטומטית למקומה החדש.
    </p>

    <p>
      <a id="home-link" href="/">לדף הבית</a>
    </p>
  </main>

  <script>
    (() => {
      "use strict";

      const isGitHubProjectSite =
        window.location.hostname.endsWith(".github.io");

      const siteBase = isGitHubProjectSite
        ? "/parasha-benichuta/"
        : "/";

      const homeLink = document.getElementById("home-link");
      const title = document.getElementById("title");
      const message = document.getElementById("message");

      homeLink.href = siteBase;

      let requestedPath = window.location.pathname;

      if (
        siteBase !== "/" &&
        requestedPath.startsWith(siteBase)
      ) {
        requestedPath =
          "/" + requestedPath.slice(siteBase.length);
      }

      fetch(siteBase + "assets/data/redirect-map.json", {
        cache: "no-store"
      })
        .then((response) => {
          if (!response.ok) {
            throw new Error("Redirect map was not found");
          }

          return response.json();
        })
        .then((redirectMap) => {
          const newPath = redirectMap[requestedPath];

          if (!newPath) {
            title.textContent = "העמוד לא נמצא";
            message.textContent =
              "ייתכן שהקישור שגוי או שהעמוד אינו קיים עוד.";
            return;
          }

          const target =
            siteBase +
            newPath.replace(/^\/+/, "") +
            window.location.search +
            window.location.hash;

          window.location.replace(target);
        })
        .catch(() => {
          title.textContent = "העמוד לא נמצא";
          message.textContent =
            "לא הצלחנו למצוא כתובת חלופית לעמוד המבוקש.";
        });
    })();
  </script>

  <script src="/assets/js/pwa-install.js"></script>


  <script src="/assets/js/accessibility.js"></script>

</body>
</html>
