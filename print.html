<!doctype html>
<html lang="he" dir="rtl" class="print-preparing">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הדפסת פרשת השבוע | פרשת השבוע בניחותא</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&family=Varela+Round&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/print.css">
  <style>
    .print-loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #fffdf8;
      color: #4f6d5a;
      font-family: "Rubik", "Noto Sans Hebrew", Arial, sans-serif;
      transition: opacity .22s ease;
    }

    .print-loading-box {
      display: grid;
      justify-items: center;
      gap: 18px;
      padding: 32px;
      text-align: center;
    }

    .print-loading-mark {
      position: relative;
      width: 76px;
      height: 76px;
      border: 5px solid #dce7de;
      border-top-color: #4f6d5a;
      border-radius: 50%;
      animation: print-spin 1s linear infinite;
    }

    .print-loading-mark::after {
      content: "";
      position: absolute;
      inset: 17px;
      border-radius: 50%;
      background: #f1f6f1;
    }

    .print-loading-title {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .print-loading-text {
      color: #75827a;
      font-size: .95rem;
    }

    html.print-preparing #print-page {
      visibility: hidden;
    }

    html:not(.print-preparing) .print-loading-screen {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes print-spin {
      to { transform: rotate(360deg); }
    }

    @media print {
      .print-loading-screen { display: none !important; }
    }
  </style>
  <script>
    (() => {
      const url = new URL(window.location.href);
      const parasha = url.searchParams.get("parasha");
      window.__printAutoRequested = url.searchParams.get("autoprint") === "1";

      if (parasha) {
        document.title = `פרשת השבוע בניחותא - ${parasha}`;
      }

      if (window.__printAutoRequested) {
        url.searchParams.delete("autoprint");
        history.replaceState(null, "", url.href);
      }
    })();
  </script>
  <script defer src="assets/js/print-cover.js"></script>
  <script defer src="assets/js/print.js"></script>
</head>
<body>
  <div class="print-loading-screen" id="print-loading-screen" aria-live="polite">
    <div class="print-loading-box">
      <div class="print-loading-mark" aria-hidden="true"></div>
      <div class="print-loading-title">מכינים את העלון לשבת</div>
      <div class="print-loading-text">מסדרים את המדורים, העמודים והשער…</div>
    </div>
  </div>

  <main class="print-page" id="print-page" aria-live="polite">
    <header class="print-cover">
      <div class="print-brand">פרשת השבוע בניחותא</div>
      <h1 id="print-title">מכין את דף ההדפסה…</h1>
    </header>

    <div id="print-status" class="print-status">
      טוען את תוכני הפרשה…
    </div>

    <div id="print-content"></div>
  </main>

  <script>
    (() => {
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      async function waitForReady() {
        const deadline = Date.now() + 20000;

        while (Date.now() < deadline) {
          const cover = document.getElementById("magazine-cover");
          const content = document.getElementById("print-content");
          const status = document.getElementById("print-status");
          const sections = content ? content.querySelectorAll(":scope > .print-section") : [];
          const indexItems = document.querySelectorAll("#magazine-cover-index > .magazine-index-item");
          const coverImage = cover?.querySelector(".magazine-cover-image");
          const imageReady = !coverImage || !coverImage.getAttribute("src") || coverImage.complete;
          const contentReady = sections.length > 0 && !status;
          const indexReady = !!cover && indexItems.length === sections.length;

          if (cover && imageReady && contentReady && indexReady) {
            if (document.fonts?.ready) {
              try { await document.fonts.ready; } catch {}
            }
            return true;
          }

          await sleep(80);
        }

        return false;
      }

      window.addEventListener("DOMContentLoaded", async () => {
        const ready = await waitForReady();
        document.documentElement.classList.remove("print-preparing");

        if (!ready || !window.__printAutoRequested) return;

        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        window.print();
      });
    })();
  </script>
</body>
</html>
