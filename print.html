<!doctype html>
<html lang="he" dir="rtl" class="print-preparing">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הדפסת פרשת השבוע | פרשת השבוע בניחותא</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gveret+Levin&family=Noto+Sans+Hebrew:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/print.css?v=11">
  <link rel="stylesheet" href="assets/css/print-cover-v2.css?v=11">
  <link rel="stylesheet" href="assets/css/print-content-fixes.css?v=11">

  <style>
    .print-loading-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, #f4f8f3 0 90px, transparent 91px),
        #fffdf8;
      color: #4f6d5a;
      font-family: "Rubik", "Noto Sans Hebrew", Arial, sans-serif;
    }

    .print-loading-box {
      display: grid;
      justify-items: center;
      gap: 17px;
      min-width: 270px;
      padding: 34px 38px;
      text-align: center;
    }

    .print-loading-mark {
      position: relative;
      width: 78px;
      height: 78px;
    }

    .print-loading-mark::before,
    .print-loading-mark::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 5px solid #dbe7dc;
      border-radius: 50%;
    }

    .print-loading-mark::after {
      border-color: #4f6d5a transparent transparent transparent;
      animation: print-spin .95s linear infinite;
    }

    .print-loading-leaf {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 30px;
      animation: print-pulse 1.25s ease-in-out infinite alternate;
    }

    .print-loading-title {
      font-size: 1.38rem;
      font-weight: 700;
    }

    .print-loading-text {
      color: #75827a;
      font-size: .95rem;
    }

    html.print-preparing #print-page {
      opacity: 0;
      pointer-events: none;
    }

    #print-page {
      opacity: 1;
    }

    html.print-ready .print-loading-screen {
      display: none;
    }

    @keyframes print-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes print-pulse {
      from { transform: scale(.92); opacity: .72; }
      to { transform: scale(1.08); opacity: 1; }
    }

    @media print {
      .print-loading-screen { display: none !important; }
    }
  </style>

  <script>
    (() => {
      const url = new URL(window.location.href);
      const parasha = url.searchParams.get("parasha");
      window.__printAutoRequested = url.searchParams.get("autoprint") === "1";
      window.__printOpenedAt = performance.now();

      try {
        const referrer = document.referrer ? new URL(document.referrer) : null;
        window.__printReturnUrl = referrer &&
          referrer.origin === window.location.origin &&
          !/\/print\.html(?:$|[?#])/i.test(referrer.href)
            ? referrer.href
            : `${window.location.origin}/`;
      } catch {
        window.__printReturnUrl = `${window.location.origin}/`;
      }

      if (parasha) {
        document.title = `פרשת השבוע בניחותא - ${parasha}`;
      }

      if (window.__printAutoRequested) {
        url.searchParams.delete("autoprint");
        history.replaceState(null, "", url.href);
      }
    })();
  </script>

  <script defer src="assets/js/print-content-fixes.js?v=11"></script>
  <script defer src="assets/js/print-cover-v2.js?v=11"></script>
  <script defer src="assets/js/print.js?v=11"></script>
  <script defer src="assets/js/print-finalize.js?v=11"></script>
</head>
<body>
  <div class="print-loading-screen" id="print-loading-screen" aria-live="polite">
    <div class="print-loading-box">
      <div class="print-loading-mark" aria-hidden="true">
        <div class="print-loading-leaf">❧</div>
      </div>
      <div class="print-loading-title">מכינים את העלון לשבת</div>
      <div class="print-loading-text">מסדרים את המדורים, העמודים והשער…</div>
    </div>
  </div>

  <main class="print-page" id="print-page" aria-live="polite">
    <header class="print-cover">
      <div class="print-brand">פרשת השבוע בניחותא</div>
      <h1 id="print-title">מכין את דף ההדפסה…</h1>
    </header>

    <div id="print-status" class="print-status">
      טוען את תוכני הפרשה…
    </div>

    <div id="print-content"></div>
  </main>

  <script>
    (() => {
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      let printDialogOpened = false;
      let returning = false;

      function returnToSite() {
        if (returning || !printDialogOpened) return;
        returning = true;

        const target = window.__printReturnUrl || `${window.location.origin}/`;
        window.setTimeout(() => {
          window.location.replace(target);
        }, 120);
      }

      window.addEventListener("afterprint", returnToSite);

      async function waitForReady() {
        const deadline = Date.now() + 25000;

        while (Date.now() < deadline) {
          const contentReady = !document.getElementById("print-status") &&
            document.querySelectorAll("#print-content > .print-section").length > 0;
          const coverReady = window.__printCoverReady === true;
          const finalizeReady = window.__printFinalizeReady === true;

          if (contentReady && coverReady && finalizeReady) {
            if (document.fonts?.ready) {
              try { await document.fonts.ready; } catch {}
            }
            return true;
          }

          await sleep(80);
        }

        return false;
      }

      window.addEventListener("DOMContentLoaded", async () => {
        const ready = await waitForReady();
        const elapsed = performance.now() - (window.__printOpenedAt || 0);
        if (elapsed < 650) await sleep(650 - elapsed);

        if (!ready || !window.__printAutoRequested) {
          document.documentElement.classList.remove("print-preparing");
          document.documentElement.classList.add("print-ready");
          return;
        }

        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        printDialogOpened = true;
        window.print();
      });
    })();
  </script>
</body>
</html>
